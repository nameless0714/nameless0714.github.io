<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Snake Game</title>
    <style>
        body {
            background-color: #111;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            margin-bottom: 10px;
        }

        #score-board {
            font-size: 24px;
            margin-bottom: 20px;
        }

        canvas {
            background-color: #000;
            border: 4px solid #333;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
        }

        .controls {
            margin-top: 15px;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>

    <h1>SNAKE</h1>
    <div id="score-board">Score: <span id="score">0</span></div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div class="controls">Use <b>Arrow Keys</b> or <b>WASD</b> to move.</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");

        // Grid and game variables
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        
        let snake = [{ x: 10, y: 10 }];
        let food = { x: 5, y: 5 };
        let dx = 1; // horizontal velocity
        let dy = 0; // vertical velocity
        let score = 0;
        let gameInterval;
        const gameSpeed = 100; // lower is faster (milliseconds)

        // Start Game
        function startGame() {
            placeFood();
            gameInterval = setInterval(updateGame, gameSpeed);
        }

        // Main game loop
        function updateGame() {
            moveSnake();

            if (checkGameOver()) {
                clearInterval(gameInterval);
                alert(`Game Over! Your score: ${score}`);
                resetGame();
                return;
            }

            checkFoodCollision();
            drawGrid();
        }

        // Draw everything
        function drawGrid() {
            // Clear canvas
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Snake
            ctx.fillStyle = "lime";
            snake.forEach((part, index) => {
                // Make the head a slightly different color if you want
                ctx.fillStyle = index === 0 ? "#00ff00" : "#00cc00";
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
            });

            // Draw Food
            ctx.fillStyle = "red";
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
        }

        // Move the snake forward
        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head); // Add new head to the front
            snake.pop(); // Remove the tail
        }

        // Check if snake hit the wall or itself
        function checkGameOver() {
            const head = snake[0];

            // Wall collisions
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                return true;
            }

            // Self collisions (skip index 0 because that's the head)
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    return true;
                }
            }
            return false;
        }

        // Check if snake ate the food
        function checkFoodCollision() {
            const head = snake[0];
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.innerText = score;
                
                // Grow snake by keeping the tail this turn
                snake.push({}); 
                
                placeFood();
            }
        }

        // Spawn food at random coordinates
        function placeFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);

            // Ensure food doesn't spawn inside the snake
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) {
                    placeFood();
                }
            });
        }

        // Handle Keyboard Controls
        window.addEventListener("keydown", e => {
            switch (e.key) {
                case "ArrowUp":
                case "w":
                case "W":
                    if (dy !== 1) { dx = 0; dy = -1; } // Prevent moving directly backwards
                    break;
                case "ArrowDown":
                case "s":
                case "S":
                    if (dy !== -1) { dx = 0; dy = 1; }
                    break;
                case "ArrowLeft":
                case "a":
                case "A":
                    if (dx !== 1) { dx = -1; dy = 0; }
                    break;
                case "ArrowRight":
                case "d":
                case "D":
                    if (dx !== -1) { dx = 1; dy = 0; }
                    break;
            }
        });

        // Reset game state
        function resetGame() {
            snake = [{ x: 10, y: 10 }];
            dx = 1;
            dy = 0;
            score = 0;
            scoreElement.innerText = score;
            startGame();
        }

        // Run the game
        startGame();
    </script>
</body>
</html>
