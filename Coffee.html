<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafe Horizon - POS System</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Lucide Icons for pretty buttons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-100 font-sans h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-amber-800 text-white p-4 shadow-md flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <i data-lucide="coffee" class="w-8 h-8"></i>
            <h1 class="text-2xl font-bold tracking-wide">Cafe Horizon POS</h1>
        </div>
        <div class="text-sm bg-amber-900 px-3 py-1 rounded-lg" id="current-time"></div>
    </header>

    <!-- Main Content Area -->
    <div class="flex-1 flex overflow-hidden">
        
        <!-- Left Side: Menu Grid (60% width) -->
        <main class="w-full md:w-3/5 p-4 overflow-y-auto">
            <!-- Category Tabs -->
            <div class="flex space-x-2 mb-4 overflow-x-auto pb-2">
                <button onclick="filterMenu('all')" class="cat-btn bg-amber-600 text-white px-4 py-2 rounded-lg font-medium shadow-sm hover:bg-amber-700 transition">All Items</button>
                <button onclick="filterMenu('coffee')" class="cat-btn bg-white text-gray-700 px-4 py-2 rounded-lg font-medium shadow-sm hover:bg-amber-100 transition">Coffee</button>
                <button onclick="filterMenu('tea')" class="cat-btn bg-white text-gray-700 px-4 py-2 rounded-lg font-medium shadow-sm hover:bg-amber-100 transition">Tea & Others</button>
                <button onclick="filterMenu('pastry')" class="cat-btn bg-white text-gray-700 px-4 py-2 rounded-lg font-medium shadow-sm hover:bg-amber-100 transition">Pastries</button>
            </div>

            <!-- Menu Items Grid -->
            <div id="menu-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-4">
                <!-- Dynamic Content via JS -->
            </div>
        </main>

        <!-- Right Side: Cart & Checkout (40% width) -->
        <aside class="hidden md:flex md:w-2/5 bg-white border-l border-gray-200 flex-col justify-between shadow-xl">
            <!-- Cart Header -->
            <div class="p-4 border-b border-gray-200 flex justify-between items-center bg-gray-50">
                <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                    <i data-lucide="shopping-cart" class="w-5 h-5 text-amber-700"></i> Current Order
                </h2>
                <button onclick="clearCart()" class="text-red-500 hover:text-red-700 text-sm font-semibold flex items-center gap-1">
                    <i data-lucide="trash-2" class="w-4 h-4"></i> Clear All
                </button>
            </div>

            <!-- Cart Items List -->
            <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-3">
                <!-- Dynamic Content via JS -->
                <div id="empty-cart-msg" class="text-center text-gray-400 mt-10">
                    <i data-lucide="cup-straw" class="w-12 h-12 mx-auto mb-2 opacity-50"></i>
                    <p>Order is empty</p>
                </div>
            </div>

            <!-- Summary & Checkout -->
            <div class="p-4 border-t border-gray-200 bg-gray-50 space-y-3">
                <div class="flex justify-between text-gray-600 text-sm">
                    <span>Subtotal</span>
                    <span id="subtotal">$0.00</span>
                </div>
                <div class="flex justify-between text-gray-600 text-sm">
                    <span>Tax (8%)</span>
                    <span id="tax">$0.00</span>
                </div>
                <hr class="border-gray-200">
                <div class="flex justify-between text-gray-900 font-black text-xl">
                    <span>Total</span>
                    <span id="total" class="text-amber-800">$0.00</span>
                </div>

                <button onclick="processCheckout()" class="w-full bg-emerald-600 text-white font-bold py-3 px-4 rounded-xl shadow-md hover:bg-emerald-700 active:scale-[0.98] transition flex justify-center items-center gap-2 text-lg mt-2">
                    <i data-lucide="credit-card" class="w-5 h-5"></i> Pay & Print Receipt
                </button>
            </div>
        </aside>
    </div>

    <!-- Hidden Mobile Cart Button (Shows up on mobile screen sizes) -->
    <div class="md:hidden fixed bottom-4 right-4 z-50">
        <button onclick="toggleMobileCart()" class="bg-amber-700 text-white p-4 rounded-full shadow-2xl relative flex items-center justify-center">
            <i data-lucide="shopping-bag" class="w-6 h-6"></i>
            <span id="mobile-cart-count" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs font-bold px-2 py-0.5 rounded-full hidden">0</span>
        </button>
    </div>

    <!-- Mobile Cart Modal Overlay -->
    <div id="mobile-cart-modal" class="fixed inset-0 bg-black/50 z-40 hidden flex justify-end">
        <div class="w-4/5 max-w-md bg-white h-full flex flex-col justify-between animate-slide-left">
            <!-- Render clone of standard cart here dynamically -->
            <div class="p-4 border-b flex justify-between items-center">
                <h2 class="font-bold text-lg">Your Order</h2>
                <button onclick="toggleMobileCart()" class="text-gray-500 text-2xl">&times;</button>
            </div>
            <div id="mobile-cart-body" class="flex-1 overflow-y-auto p-4"></div>
            <div id="mobile-cart-footer" class="p-4 bg-gray-50 border-t"></div>
        </div>
    </div>

    <!-- JavaScript logic -->
    <script>
        // Menu Data
        const menuItems = [
            { id: 1, name: 'Espresso', price: 3.00, category: 'coffee', color: 'bg-amber-100', icon: 'coffee' },
            { id: 2, name: 'Americano', price: 3.50, category: 'coffee', color: 'bg-amber-100', icon: 'coffee' },
            { id: 3, name: 'Latte', price: 4.50, category: 'coffee', color: 'bg-amber-100', icon: 'coffee' },
            { id: 4, name: 'Cappuccino', price: 4.50, category: 'coffee', color: 'bg-amber-100', icon: 'coffee' },
            { id: 5, name: 'Caramel Macchiato', price: 5.00, category: 'coffee', color: 'bg-amber-100', icon: 'coffee' },
            { id: 6, name: 'Matcha Latte', price: 4.75, category: 'tea', color: 'bg-emerald-100', icon: 'leaf' },
            { id: 7, name: 'Chai Tea Latte', price: 4.75, category: 'tea', color: 'bg-emerald-100', icon: 'leaf' },
            { id: 8, name: 'Hot Chocolate', price: 4.00, category: 'tea', color: 'bg-orange-100', icon: 'milk' },
            { id: 9, name: 'Butter Croissant', price: 3.75, category: 'pastry', color: 'bg-yellow-100', icon: 'cookie' },
            { id: 10, name: 'Chocolate Muffin', price: 3.50, category: 'pastry', color: 'bg-yellow-100', icon: 'cookie' },
            { id: 11, name: 'Blueberry Scone', price: 3.75, category: 'pastry', color: 'bg-yellow-100', icon: 'cookie' },
        ];

        let cart = [];
        const TAX_RATE = 0.08;

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            renderMenu('all');
            updateCartUI();
            
            // Set dynamic live clock
            setInterval(() => {
                const now = new Date();
                document.getElementById('current-time').innerText = now.toLocaleString();
            }, 1000);
            
            // Initialize Lucide Icons
            lucide.createIcons();
        });

        // Render Menu Cards
        function renderMenu(category) {
            const grid = document.getElementById('menu-grid');
            grid.innerHTML = '';

            const filtered = category === 'all' ? menuItems : menuItems.filter(item => item.category === category);

            filtered.forEach(item => {
                const card = document.createElement('button');
                card.className = `${item.color} p-5 rounded-2xl shadow-sm hover:shadow-md border border-gray-200/50 flex flex-col justify-between items-start text-left active:scale-[0.97] transition h-32 relative overflow-hidden group`;
                card.onclick = () => addToCart(item.id);
                
                card.innerHTML = `
                    <div class="z-10">
                        <span class="block font-bold text-gray-800 text-lg leading-tight">${item.name}</span>
                        <span class="block text-amber-900 font-black mt-2">$${item.price.toFixed(2)}</span>
                    </div>
                    <div class="absolute bottom-2 right-2 opacity-15 group-hover:opacity-25 transition-opacity">
                         <i data-lucide="${item.icon}" class="w-16 h-16 text-black"></i>
                    </div>
                `;
                grid.appendChild(card);
            });
            lucide.createIcons();
        }

        // Category Filter Style Toggles
        function filterMenu(category) {
            renderMenu(category);
            const buttons = document.querySelectorAll('.cat-btn');
            buttons.forEach(btn => {
                if(btn.innerText.toLowerCase().includes(category) || (category === 'all' && btn.innerText === 'All Items')) {
                    btn.classList.remove('bg-white', 'text-gray-700');
                    btn.classList.add('bg-amber-600', 'text-white');
                } else {
                    btn.classList.remove('bg-amber-600', 'text-white');
                    btn.classList.add('bg-white', 'text-gray-700');
                }
            });
        }

        // Add Item to Cart Logic
        function addToCart(id) {
            const product = menuItems.find(item => item.id === id);
            const existingItem = cart.find(item => item.id === id);

            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            updateCartUI();
        }

        // Change quantities within checkout pane
        function changeQuantity(id, amount) {
            const item = cart.find(item => item.id === id);
            if (!item) return;

            item.quantity += amount;
            if (item.quantity <= 0) {
                cart = cart.filter(item => item.id !== id);
            }
            updateCartUI();
        }

        function clearCart() {
            if(cart.length === 0) return;
            if(confirm("Clear current order?")) {
                cart = [];
                updateCartUI();
            }
        }

        // Update Totals and Render Cart UI Element
        function updateCartUI() {
            const cartContainer = document.getElementById('cart-items');
            const emptyMsg = document.getElementById('empty-cart-msg');
            
            // Calculate calculations
            let subtotal = 0;
            let totalItemsCount = 0;
            
            // Clean up old cart list items except the message
            const currentItems = cartContainer.querySelectorAll('.cart-item-row');
            currentItems.forEach(el => el.remove());

            if (cart.length === 0) {
                emptyMsg.classList.remove('hidden');
            } else {
                emptyMsg.classList.add('hidden');
                
                cart.forEach(item => {
                    subtotal += item.price * item.quantity;
                    totalItemsCount += item.quantity;

                    const row = document.createElement('div');
                    row.className = 'cart-item-row flex justify-between items-center bg-gray-50 p-3 rounded-xl border border-gray-100';
                    row.innerHTML = `
                        <div class="flex-1 min-w-0 pr-2">
                            <h4 class="font-semibold text-gray-800 truncate">${item.name}</h4>
                            <span class="text-xs text-gray-500">$${item.price.toFixed(2)} each</span>
                        </div>
                        <div class="flex items-center space-x-2">
                            <button onclick="changeQuantity(${item.id}, -1)" class="w-7 h-7 rounded-full bg-white border border-gray-300 flex items-center justify-center text-gray-600 hover:bg-gray-100 active:scale-95 text-lg font-bold">-</button>
                            <span class="font-bold text-gray-800 w-6 text-center">${item.quantity}</span>
                            <button onclick="changeQuantity(${item.id}, 1)" class="w-7 h-7 rounded-full bg-white border border-gray-300 flex items-center justify-center text-gray-600 hover:bg-gray-100 active:scale-95 text-lg font-bold">+</button>
                        </div>
                        <div class="w-16 text-right font-bold text-gray-800 ml-2">
                            $${(item.price * item.quantity).toFixed(2)}
                        </div>
                    `;
                    cartContainer.appendChild(row);
                });
            }

            // Math Logic Calculations
            const tax = subtotal * TAX_RATE;
            const total = subtotal + tax;

            // Apply to Desktop Sidebar View
            document.getElementById('subtotal').innerText = `$${subtotal.toFixed(2)}`;
            document.getElementById('tax').innerText = `$${tax.toFixed(2)}`;
            document.getElementById('total').innerText = `$${total.toFixed(2)}`;

            // Apply to Mobile Badge Icon Tracker
            const mobileCountBadge = document.getElementById('mobile-cart-count');
            if(totalItemsCount > 0) {
                mobileCountBadge.innerText = totalItemsCount;
                mobileCountBadge.classList.remove('hidden');
            } else {
                mobileCountBadge.classList.add('hidden');
            }

            // Keep responsive sync dynamically mapped to modal clone layouts if active
            syncMobileModal(subtotal, tax, total);
        }

        // Mobile Friendly Overlay Triggering
        function toggleMobileCart() {
            const modal = document.getElementById('mobile-cart-modal');
            modal.classList.toggle('hidden');
            updateCartUI();
        }

        function syncMobileModal(subtotal, tax, total) {
            const mobileBody = document.getElementById('mobile-cart-body');
            const mobileFooter = document.getElementById('mobile-cart-footer');
            
            if(!mobileBody || !mobileFooter) return;

            // Sync structural list clones
            mobileBody.innerHTML = '';
            if(cart.length === 0) {
                mobileBody.innerHTML = `<p class="text-center text-gray-400 mt-10">No items selected</p>`;
            } else {
                cart.forEach(item => {
                    const cloneRow = document.createElement('div');
                    cloneRow.className = 'flex justify-between items-center border-b py-3';
                    cloneRow.innerHTML = `
                        <div>
                            <h4 class="font-bold">${item.name}</h4>
                            <small class="text-gray-500">Qty: ${item.quantity}</small>
                        </div>
                        <span class="font-semibold">$${(item.price * item.quantity).toFixed(2)}</span>
                    `;
                    mobileBody.appendChild(cloneRow);
                });
            }

            // Sync dynamic totals to mobile footer view layouts
            mobileFooter.innerHTML = `
                <div class="space-y-1 text-sm mb-3">
                    <div class="flex justify-between"><span>Subtotal</span><span>$${subtotal.toFixed(2)}</span></div>
                    <div class="flex justify-between"><span>Tax</span><span>$${tax.toFixed(2)}</span></div>
                    <div class="flex justify-between font-bold text-base text-amber-950"><span>Total</span><span>$${total.toFixed(2)}</span></div>
                </div>
                <button onclick="processCheckout(); toggleMobileCart();" class="w-full bg-emerald-600 text-white font-bold py-2.5 rounded-lg text-center shadow">
                    Complete Checkout
                </button>
            `;
        }

        // Final Alert Simulation Processing Block
        function processCheckout() {
            if(cart.length === 0) {
                alert("Please add items to the order first!");
                return;
            }
            
            let receiptText = `===== CAFE HORIZON RECEIPT =====\n`;
            receiptText += `Date/Time: ${new Date().toLocaleString()}\n`;
            receiptText += `--------------------------------\n`;
            cart.forEach(item => {
                receiptText += `${item.name.padEnd(18)} x${item.item ? item.item : item.quantity}   $${(item.price * item.quantity).toFixed(2)}\n`;
            });
            receiptText += `--------------------------------\n`;
            receiptText += `Subtotal: ${document.getElementById('subtotal').innerText}\n`;
            receiptText += `Tax (8%): ${document.getElementById('tax').innerText}\n`;
            receiptText += `TOTAL:    ${document.getElementById('total').innerText}\n`;
            receiptText += `================================\n`;
            receiptText += `   Thank you for your business!`;

            alert(receiptText);
            
            // Flush state post order completing cycle simulation runs
            cart = [];
            updateCartUI();
        }
    </script>
</body>
</html>
